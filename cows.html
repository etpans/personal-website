<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cows — Evan Tran</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="./style.css" rel="stylesheet" />
    <link href="./src/cows.css" rel="stylesheet" />
    <script src="./src/cows.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="text-base font-normal leading-7">
    <main class="mx-auto max-w-2xl px-[22px] py-16 sm:px-7 sm:py-24">
      <div class="page-content">
        <a class="cow-mark" href="./" aria-label="Evan Tran home">
          <img src="./assets/cow.png" alt="" width="48" height="48" />
        </a>
        <h1 class="text-3xl font-semibold tracking-tight">Over the mooooooon</h1>
        <figure class="moon-scene">
          <img
            class="moon-scene-landscape"
            src="./assets/cow-landscape.svg"
            alt="A pixel-art night sky filled with stars, a pale full moon above blue hills, and a quiet grassy meadow."
            width="320"
            height="180"
          />
          <svg class="shooting-star-layer" viewBox="0 0 320 180" aria-hidden="true" focusable="false"></svg>
          <svg class="cow-layer" viewBox="0 0 320 180" aria-hidden="true" focusable="false">
            <image class="jumping-cow" href="./assets/cow-jump.svg" x="-20" y="-14" width="40" height="28" />
          </svg>
        </figure>
        <div class="wish-controls">
          <p class="wish-prompt" hidden>
            <span aria-hidden="true">⋆ ✧</span> There is a shooting star! <span aria-hidden="true">✧ ⋆</span>
          </p>
          <button class="wish-button" type="button" hidden>Make a wish</button>
          <p class="wish-dialogue" aria-hidden="true" hidden></p>
          <p class="wish-announcement" role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </div>

      <footer class="mt-8 border-t pt-5">
        <p class="copyright text-sm">&copy; 2026 Evan Tran</p>
        <a class="footer-source" href="https://github.com/etpans/personal-website" target="_blank" rel="noopener noreferrer" aria-label="View website source on GitHub" title="View website source on GitHub">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.043-1.61-4.043-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.085 1.838 1.237 1.838 1.237 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.762-1.605-2.665-.305-5.467-1.334-5.467-5.93 0-1.31.468-2.382 1.236-3.222-.123-.303-.536-1.524.117-3.176 0 0 1.008-.323 3.301 1.23A11.52 11.52 0 0 1 12 6.3c1.02.005 2.047.138 3.006.404 2.291-1.553 3.297-1.23 3.297-1.23.655 1.652.242 2.873.12 3.176.77.84 1.235 1.912 1.235 3.222 0 4.61-2.807 5.622-5.48 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.902-.015 3.296 0 .322.216.696.825.578C20.565 22.297 24 17.8 24 12.5 24 5.87 18.627.5 12 .5Z" />
          </svg>
        </a>
      </footer>
    </main>
  </body>
</html>
