    <title>Cows — Evan Tran</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="./style.css" rel="stylesheet" />
    <link href="./src/cows.css" rel="stylesheet" />

  <body class="text-base font-normal leading-7">
    <main class="mx-auto max-w-2xl px-[22px] py-16 sm:px-7 sm:py-24">
      <div class="page-content">
        <a class="cow-mark" href="./" aria-label="Evan Tran home">
          <img src="./assets/cow.png" alt="" width="48" height="48" />
        </a>
        <h1 class="text-3xl font-semibold tracking-tight">Over the mooooooon</h1>
        <figure class="moon-scene">
          <img
            class="moon-scene-landscape"
            src="./assets/cow-landscape.svg"
            alt="A pixel-art night sky filled with stars, a pale full moon above blue hills, and a quiet grassy meadow."
            width="320"
            height="180"
          />
          <svg class="shooting-star-layer" viewBox="0 0 320 180" aria-hidden="true" focusable="false"></svg>
          <svg class="cow-layer" viewBox="0 0 320 180" aria-hidden="true" focusable="false">
            <image class="jumping-cow" href="./assets/cow-jump.svg" x="-20" y="-14" width="40" height="28" />
          </svg>
        </figure>
        <div class="wish-controls">
          <p class="wish-prompt" hidden>
            <span aria-hidden="true">⋆ ✧</span> There is a shooting star! <span aria-hidden="true">✧ ⋆</span>
          </p>
          <button class="wish-button" type="button" hidden>Make a wish</button>
          <p class="wish-dialogue" aria-hidden="true" hidden></p>
          <p class="wish-announcement" role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </div>
