<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cows — Evan Tran</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="./style.css" rel="stylesheet" />
    <link href="./src/cows.css" rel="stylesheet" />
    <script src="./src/cows.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="text-base font-normal leading-7">
    <main class="mx-auto max-w-2xl px-[22px] py-16 sm:px-7 sm:py-24">
      <a class="cow-mark" href="./index.html" aria-label="Evan Tran home">
        <img src="./assets/cow.png" alt="" width="48" height="48" />
      </a>
      <h1 class="text-3xl font-semibold tracking-tight">Over the moon</h1>
      <figure class="moon-scene">
        <img
          class="moon-scene-landscape"
          src="./assets/cow-landscape.svg"
          alt="A pixel-art night sky filled with stars, a pale full moon above blue hills, and a quiet grassy meadow."
          width="320"
          height="180"
        />
        <svg class="shooting-star-layer" viewBox="0 0 320 180" aria-hidden="true" focusable="false"></svg>
      </figure>
      <p class="mt-5">
        <a class="inline-link" href="./index.html">Back home</a>
      </p>
    </main>
  </body>
</html>
